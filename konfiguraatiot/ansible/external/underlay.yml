- name: Query for directly connected neighbors
  gather_facts: false
  hosts: bgws,dc_core
  tasks:
    - name: Run show cdp neighbors
      cisco.nxos.nxos_command:
        commands:
          - show cdp neighbors detail | json
      register:
        neighbors: _task.result.stdout[0] | community.general.json_query("TABLE_cdp_neighbor_detail_info.ROW_cdp_neighbor_detail_info[?intf_id!='mgmt0']")

- name: Configure site-external interface settings
  gather_facts: false
  hosts: bgws
  tasks:
    - name: Enable interface multi-site dci-tracking
      cisco.nxos.nxos_l3_interfaces:
        config:
          - name: "{{ item.intf_id }}"
            evpn_multisite_tracking: "dci-tracking"
      loop: "{{ neighbors }}"
      loop_control:
        label: "{{ item.intf_id }}"
      when: "'spine' not in item.sysname"

- name: Create route-map for interface tags
  gather_facts: false
  hosts: bgws,dc_core
  tasks:
    - name: Configure route-map
      cisco.nxos.nxos_route_maps:
        config:
          - route_map: TAG
            entries:
              - sequence: 10
                action: permit
                match:
                  tags: "{{ dc_id ~ site_id }}"

- name: Configure BGP process
  gather_facts: false
  hosts: bgws,dc_core
  tasks:
    - name: Configure eBGP underlay peers
      cisco.nxos.nxos_bgp_global:
        config:
          as_number: "{{ asn }}"
          router_id: "{{ lo0.split('/')[0] }}"
          log_neighbor_changes: true
          neighbors:
            - neighbor_address: "{{ item.v4addr }}"
              remote_as: "{{ hostvars[item.sysname.split('-')[-1]]['asn'] }}"
              update_source: "{{ item.intf_id }}"
      loop: "{{ neighbors }}"
      loop_control:
        label: "{{ item.v4addr }}"
      when: "'spine' not in item.sysname"

    - name: Enable eBGP neighbor IPv4 Unicast
      cisco.nxos.nxos_bgp_neighbor_address_family:
        config:
          as_number: "{{ asn }}"
          neighbors:
            - neighbor_address: "{{ item.v4addr }}"
              address_family:
                - afi: ipv4
                  safi: unicast
      loop: "{{ neighbors }}"
      loop_control:
        label: "{{ item.v4addr }}"
      when: "'spine' not in item.sysname"

    - name: Configure path settings for BGWs
      cisco.nxos.nxos_bgp_address_family:
        config:
          as_number: "{{ asn }}"
          address_family:
            - afi: ipv4
              safi: unicast
              maximum_paths:
                parallel_paths: "{{ groups['dc_core'] | length }}"
      when: inventory_hostname in groups['bgws']

    - name: Configure eBGP redistribution
      cisco.nxos.nxos_bgp_address_family:
        config:
          as_number: "{{ asn }}"
          address_family:
          - afi: ipv4
            safi: unicast
            redistribute:
              - protocol: "direct"
                route_map: TAG

- name: Create checkpoint
  gather_facts: false
  hosts: bgws,dc_core
  tasks:
    - name: Create checkpoint external-underlay
      cisco.nxos.nxos_command:
        commands:
          - "configure terminal"
          - "checkpoint external-underlay"
          - "end"
