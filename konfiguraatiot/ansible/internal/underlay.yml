- name: Query for directly connected neighbors
  gather_facts: false
  hosts: nves,spines
  tasks:
    - name: Run show cdp neighbors
      cisco.nxos.nxos_command:
        commands:
          - show cdp neighbors detail | json
      register:
        neighbors: _task.result.stdout[0] | community.general.json_query("TABLE_cdp_neighbor_detail_info.ROW_cdp_neighbor_detail_info[?intf_id!='mgmt0']")

- name: Configure OSPF process
  gather_facts: false
  hosts: nves,spines
  tasks:
    - name: Ensure OSPF is enabled
      cisco.nxos.nxos_feature:
        feature: ospf
        state: enabled

    - name: Configure OSPF UNDERLAY instance
      cisco.nxos.nxos_ospfv2:
        config:
          processes:
            - process_id: "UNDERLAY"
              router_id: "{{ lo0 }}"
              auto_cost:
                reference_bandwidth: 100
                unit: "Gbps"
              log_adjacency_changes:
                log: true

    - name: Configure loopbacks to OSPF
      cisco.nxos.nxos_ospf_interfaces:
        config:
          - name: "{{ item }}"
            address_family:
              - afi: ipv4
                processes:
                  - process_id: "UNDERLAY"
                    area:
                      area_id: 0.0.0.0
      loop:
        - lo0
        - lo1
        - lo100
      when: lookup('vars', item) is not none 

    - name: Configure site-internal interfaces to OSPF
      cisco.nxos.nxos_ospf_interfaces:
        config:
          - name: "{{ item.intf_id }}"
            address_family:
              - afi: ipv4
                network: point-to-point
                processes:
                  - process_id: "UNDERLAY"
                    area:
                      area_id: 0.0.0.0
      loop: "{{ neighbors }}"
      loop_control:
        label: "{{ item.intf_id }}"
      when: "'core' not in item.sysname"

- name: Configure Multi-site settings for BGWs
  gather_facts: false
  hosts: bgws
  tasks:
    - name: Configure EVPN Multi-site site-id
      cisco.nxos.nxos_command:
        commands: 
          - "configure terminal"
          - "evpn multisite border-gateway {{ site_id }}"
          - "delay-restore time 300"
          - "end"

    - name: Configure site-internal fabric-tracking
      cisco.nxos.nxos_l3_interfaces:
        config:
          - name: "{{ item.intf_id }}"
            evpn_multisite_tracking: "fabric-tracking"
      loop: "{{ neighbors }}"
      loop_control:
        label: "{{ item.intf_id }}"
      when: "'core' not in item.sysname"

- name: Create checkpoint
  gather_facts: false
  hosts: nves,spines
  tasks:
    - name: Create checkpoint internal-underlay
      cisco.nxos.nxos_command:
        commands:
          - "configure terminal"
          - "checkpoint internal-underlay"
          - "end"
