#
# Device-Id table
# --------------------------
# Role       | Device-Id range
# --------------------------
# SERVER   | 1-99
# VTEP     | 100-129
# SPINE    | 130-159
# BGW      | 160-189
# CORE     | 190-219
# Reserved | 220-254
# --------------------------

#
# Underlay IP Addressing table
# ---------------------------------------------------------------------------------------
# Reason         | Prefix         | 2nd Octet     | 3rd Octet      | 4th Octet
# ---------------------------------------------------------------------------------------
# Mgmt           | 192.168.0.0/16 | -             | DC-Id          | Device-Id
# RID            | 10.0.0.0/8     | 0             | DC-Id+Site-Id  | Device-Id
# VTEP PIP       | 10.0.0.0/8     | 1             | DC-Id+Site-Id  | Device-Id
# Multi-site VIP | 10.0.0.0/8     | 100           | DC-Id+Site-Id  | 1
# External links | 10.0.0.0/8     | BGW Device-Id | Core Device-Id | 1 (BGWs) / 2 (COREs)
# ---------------------------------------------------------------------------------------

vteps:
  hosts:
    vtep100:
      device_id: 100
    vtep101:
      device_id: 101
    vtep102:
      device_id: 102
    vtep103:
      device_id: 103
  vars:
    role: vtep

spines:
  hosts:
    spine130:
      device_id: 130
    spine131:
      device_id: 131
    spine132:
      device_id: 132
    spine133:
      device_id: 133
  vars:
    role: spine

bgws:
  hosts:
    bgw160:
      device_id: 160
    bgw161:
      device_id: 161
    bgw162:
      device_id: 162
    bgw163:
      device_id: 163
  vars:
    role: bgw
    lo100_desc: Multi-site VTEP VIP

nves:
  children:
    vteps:
    bgws:
  vars:
    lo1_desc: VTEP PIP

dc_core:
  hosts:
    core190:
      device_id: 190
    core191:
      device_id: 191
  vars:
    role: core
    site_id: 0

site_1:
  hosts:
    vtep100:
    vtep101:
    spine130:
    spine131:
    bgw160:
    bgw161:
  vars:
    site_id: 1

site_2:
  hosts:
    vtep102:
    vtep103:
    spine132:
    spine133:
    bgw162:
    bgw163:
  vars:
    site_id: 2

datacenter:
  children:
    site_1:
    site_2:
    dc_core:
  vars:
    dc_id: 01
    lo0_desc: Router-Id

all:
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: cisco.nxos.nxos
    ansible_become: true
    ansible_become_method: enable
    ansible_user: admin
